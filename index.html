<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>گالری نقره محمودی</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#1b1b1d;
    --velvet:#3a1620;
    --velvet-2:#4a1c28;
    --silver:#d7dbe0;
    --silver-dim:#9a9fa6;
    --chrome:#eef1f4;
    --ember:#8a4b3a;
    --ivory:#f2efe9;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(120% 55% at 50% -10%, #ffffff0d 0%, transparent 60%),
      var(--graphite);
    color:var(--ivory);
    font-family:'Vazirmatn', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    padding-bottom:calc(96px + var(--safe-bottom));
  }
  ::selection{background:var(--silver); color:var(--graphite);}

  header{
    position:sticky; top:0; z-index:30;
    padding:22px 20px 16px;
    background:linear-gradient(180deg, var(--graphite) 60%, transparent);
    backdrop-filter: blur(6px);
    text-align:center;
    border-bottom:1px solid #d7dbe022;
  }
  .brand{
    font-size:23px; font-weight:800; letter-spacing:.5px;
    color:var(--chrome);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .brand .ring-mark{
    width:16px; height:16px; border:2.5px solid var(--silver);
    border-radius:50%; display:inline-block; position:relative;
  }
  .brand .ring-mark::after{
    content:''; position:absolute; top:-5px; left:50%; transform:translateX(-50%);
    width:5px; height:5px; background:var(--ember); border-radius:1px;
  }
  .tagline{
    margin-top:6px; font-size:12.5px; color:var(--silver-dim);
    letter-spacing:.3px;
  }

  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:16px 20px 4px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 18px; border-radius:999px;
    border:1px solid #d7dbe030; color:var(--silver-dim);
    font-size:13px; font-weight:500; white-space:nowrap;
    background:#ffffff08; cursor:pointer; transition:.2s;
  }
  .chip.active{
    background:var(--silver); color:var(--graphite); border-color:var(--silver);
    font-weight:700;
  }

  main{padding:14px 16px 20px;}
  .card{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg, var(--velvet), var(--velvet-2));
    border:1px solid #d7dbe022;
    border-radius:18px;
    padding:14px; margin-bottom:12px;
    position:relative; overflow:hidden;
  }
  .card::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(60% 100% at 100% 0%, #ffffff10, transparent);
    pointer-events:none;
  }
  .jewel{
    flex:0 0 auto; width:54px; height:54px; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .jewel .ring{
    width:38px; height:38px; border-radius:50%;
    border:5px solid var(--silver);
    box-shadow: inset 0 0 0 1px #00000030, 0 3px 8px #00000050;
  }
  .jewel .gem{
    position:absolute; top:2px; left:50%; transform:translateX(-50%) rotate(45deg);
    width:12px; height:12px; border-radius:2px;
  }
  .info{flex:1; min-width:0;}
  .name{font-size:15.5px; font-weight:700; color:var(--chrome);}
  .notes{font-size:12px; color:var(--silver-dim); margin-top:3px; line-height:1.7;}
  .row-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .price{font-size:13.5px; font-weight:700; color:var(--chrome);}
  .price::after{content:' تومان';font-weight:500; font-size:11px; color:var(--silver-dim);}
  .add-btn{
    width:34px; height:34px; border-radius:50%; border:none;
    background:var(--silver); color:var(--graphite); font-size:19px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .15s;
  }
  .add-btn:active{transform:scale(.88);}
  .stepper{
    display:flex; align-items:center; gap:10px;
    background:#00000030; border-radius:999px; padding:4px 10px;
  }
  .stepper button{
    width:22px;height:22px;border:none;border-radius:50%;
    background:var(--silver); color:var(--graphite); font-weight:800; font-size:14px;
    cursor:pointer;
  }
  .stepper span{font-size:13px; font-weight:700; min-width:14px; text-align:center;}

  .cart-bar{
    position:fixed; left:16px; right:16px; bottom:calc(16px + var(--safe-bottom));
    background:var(--silver); color:var(--graphite);
    border-radius:16px; padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 10px 28px #00000070;
    z-index:40; cursor:pointer;
    transform:translateY(120%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .cart-bar.show{transform:translateY(0);}
  .cart-bar .left{font-weight:800; font-size:14.5px; display:flex; gap:8px; align-items:center;}
  .cart-bar .count{
    background:var(--graphite); color:var(--silver);
    width:22px;height:22px;border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
  }
  .cart-bar .total{font-weight:800; font-size:14.5px;}

  .overlay{
    position:fixed; inset:0; background:#000000a8; opacity:0; pointer-events:none;
    transition:opacity .3s; z-index:50;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--graphite); border-radius:22px 22px 0 0;
    border-top:1px solid #d7dbe030;
    padding:18px 18px calc(18px + var(--safe-bottom));
    transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
    max-height:80vh; display:flex; flex-direction:column;
  }
  .drawer.show{transform:translateY(0);}
  .drawer-handle{
    width:38px; height:4px; background:#d7dbe055; border-radius:99px;
    margin:0 auto 14px;
  }
  .drawer h3{margin:0 0 12px; font-size:16px; color:var(--chrome);}
  .drawer-items{overflow-y:auto; flex:1;}
  .drawer-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid #ffffff10;
  }
  .drawer-item .di-name{font-size:13.5px; font-weight:600;}
  .drawer-item .di-price{font-size:11.5px; color:var(--silver-dim); margin-top:2px;}
  .drawer-total{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0 6px; font-size:15px; font-weight:800; color:var(--chrome);
  }
  .form-block{margin-top:10px;}
  .form-block label{font-size:12px; color:var(--silver-dim); display:block; margin-bottom:6px;}
  .form-block input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid #d7dbe030;
    background:#ffffff0a; color:var(--ivory); font-family:inherit; font-size:13.5px;
    margin-bottom:10px;
  }
  .form-block input::placeholder{color:#ffffff55;}
  .checkout-btn{
    width:100%; padding:15px; border:none; border-radius:14px;
    background:var(--silver); color:var(--graphite); font-size:15px; font-weight:800;
    font-family:inherit; cursor:pointer; margin-top:6px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .checkout-btn:disabled{opacity:.6;}
  .empty-cart{text-align:center; color:var(--silver-dim); padding:30px 0; font-size:13.5px;}
  .gateway-note{
    font-size:11px; color:var(--silver-dim); text-align:center; margin-top:10px; line-height:1.9;
  }
  .gateway-note b{color:var(--chrome);}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:var(--silver); color:var(--graphite); padding:10px 20px; border-radius:999px;
    font-size:13px; font-weight:700; z-index:80; transition:transform .3s;
    white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2.5px solid #1b1b1d55; border-top-color:#1b1b1d;
    animation:spin .7s linear infinite; display:none;
  }
  .spinner.show{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="ring-mark"></span>گالری نقره محمودی</div>
  <div class="tagline">زیورآلات نقره اصل، دست‌ساز و آبکاری‌شده</div>
</header>

<div class="chips" id="chips"></div>

<main id="product-list"></main>

<div class="cart-bar" id="cartBar">
  <div class="left"><span class="count" id="cartCount">0</span> مشاهده سبد خرید</div>
  <div class="total" id="cartTotal">۰ تومان</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <h3>سبد خرید شما</h3>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-total">
    <span>جمع کل</span>
    <span id="drawerTotal">۰ تومان</span>
  </div>

  <div class="form-block" id="checkoutForm">
    <label>شماره موبایل برای پیگیری سفارش</label>
    <input type="tel" id="phoneInput" placeholder="۰۹xxxxxxxxx" inputmode="numeric">
  </div>

  <button class="checkout-btn" id="checkoutBtn">
    <span class="spinner" id="paySpinner"></span>
    <span id="checkoutLabel">پرداخت و ثبت سفارش</span>
  </button>
  <div class="gateway-note">پرداخت امن از طریق درگاه <b>زرین‌پال</b></div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  try {
    tg.setHeaderColor('#1b1b1d');
    tg.setBackgroundColor('#1b1b1d');
  } catch(e) {}
}

const BACKEND_URL = 'https://YOUR-BACKEND-DOMAIN.example.com/api/create-payment';
const DEMO_MODE = true;

const PRODUCTS = [
  { id:1, cat:'انگشتر', name:'انگشتر نقره فیروزه', notes:'نقره ۹۲۵ عیار، نگین فیروزه نیشابوری', price:1250000, gem:'#2f8a86' },
  { id:2, cat:'انگشتر', name:'انگشتر نقره سولیتر', notes:'نقره ۹۲۵ عیار، آبکاری رودیوم', price:980000, gem:'#c9ced4' },
  { id:3, cat:'دستبند', name:'دستبند زنجیری نقره', notes:'نقره خالص، طرح ظریف زنانه', price:1450000, gem:'#8a4b3a' },
  { id:4, cat:'دستبند', name:'دستبند مردانه کارتیه', notes:'نقره ۹۲۵ عیار، طرح مردانه', price:1680000, gem:'#4a4f57' },
  { id:5, cat:'گردنبند', name:'گردنبند نگین عقیق', notes:'نقره اصل، نگین عقیق قرمز یمن', price:1890000, gem:'#7a2e2e' },
  { id:6, cat:'گوشواره', name:'گوشواره مروارید نقره', notes:'نقره ۹۲۵ عیار، مروارید غلتکی', price:990000, gem:'#e8e4da' },
];
const CATS = ['همه', 'انگشتر', 'دستبند', 'گردنبند', 'گوشواره'];

let activeCat = 'همه';
let cart = {};

const faDigits = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const formatPrice = n => faDigits(n.toLocaleString('en-US'));

function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = '';
  CATS.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (cat === activeCat ? ' active' : '');
    chip.textContent = cat;
    chip.onclick = () => { activeCat = cat; renderChips(); renderProducts(); };
    el.appendChild(chip);
  });
}

function renderProducts(){
  const el = document.getElementById('product-list');
  el.innerHTML = '';
  const list = PRODUCTS.filter(p => activeCat === 'همه' || p.cat === activeCat);
  list.forEach(p => {
    const qty = cart[p.id] || 0;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="jewel">
        <div class="ring"></div>
        <div class="gem" style="background:${p.gem}"></div>
      </div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="notes">${p.notes}</div>
        <div class="row-bottom">
          <div class="price">${formatPrice(p.price)}</div>
          <div class="qty-holder" id="qty-${p.id}"></div>
        </div>
      </div>
    `;
    el.appendChild(card);
    renderQtyControl(p.id, qty);
  });
}

function renderQtyControl(id, qty){
  const holder = document.getElementById('qty-' + id);
  if (!holder) return;
  if (qty > 0) {
    holder.innerHTML = `
      <div class="stepper">
        <button data-act="inc">+</button>
        <span>${faDigits(qty)}</span>
        <button data-act="dec">−</button>
      </div>`;
    holder.querySelector('[data-act="inc"]').onclick = () => changeQty(id, 1);
    holder.querySelector('[data-act="dec"]').onclick = () => changeQty(id, -1);
  } else {
    holder.innerHTML = `<button class="add-btn">+</button>`;
    holder.querySelector('.add-btn').onclick = () => changeQty(id, 1);
  }
}

function changeQty(id, delta){
  const newQty = (cart[id] || 0) + delta;
  if (newQty <= 0) { delete cart[id]; } else { cart[id] = newQty; }
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  if (delta > 0) showToast('به سبد اضافه شد');
  renderQtyControl(id, cart[id] || 0);
  renderCartBar();
  renderDrawer();
}

function cartSummary(){
  let count = 0, total = 0;
  Object.entries(cart).forEach(([id, qty]) => {
    const p = PRODUCTS.find(p => p.id == id);
    if (!p) return;
    count += qty;
    total += qty * p.price;
  });
  return { count, total };
}

function renderCartBar(){
  const { count, total } = cartSummary();
  const bar = document.getElementById('cartBar');
  document.getElementById('cartCount').textContent = faDigits(count);
  document.getElementById('cartTotal').textContent = formatPrice(total) + ' تومان';
  bar.classList.toggle('show', count > 0);
  updateMainButton(count, total);
}

function renderDrawer(){
  const el = document.getElementById('drawerItems');
  const { total, count } = cartSummary();
  document.getElementById('drawerTotal').textContent = formatPrice(total) + ' تومان';
  el.innerHTML = '';
  if (count === 0) {
    el.innerHTML = '<div class="empty-cart">سبد خرید شما خالی است</div>';
    return;
  }
  Object.entries(cart).forEach(([id, qty]) => {
    const p = PRODUCTS.find(p => p.id == id);
    if (!p) return;
    const row = document.createElement('div');
    row.className = 'drawer-item';
    row.innerHTML = `
      <div>
        <div class="di-name">${p.name}</div>
        <div class="di-price">${faDigits(qty)} × ${formatPrice(p.price)} تومان</div>
      </div>
      <div class="stepper">
        <button data-act="inc">+</button>
        <span>${faDigits(qty)}</span>
        <button data-act="dec">−</button>
      </div>
    `;
    row.querySelector('[data-act="inc"]').onclick = () => changeQty(p.id, 1);
    row.querySelector('[data-act="dec"]').onclick = () => changeQty(p.id, -1);
    el.appendChild(row);
  });
}

const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');
function openDrawer(){
  renderDrawer();
  overlay.classList.add('show');
  drawer.classList.add('show');
}
function closeDrawer(){
  overlay.classList.remove('show');
  drawer.classList.remove('show');
}
document.getElementById('cartBar').onclick = openDrawer;
overlay.onclick = closeDrawer;

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function setPaying(isPaying){
  document.getElementById('paySpinner').classList.toggle('show', isPaying);
  document.getElementById('checkoutLabel').textContent = isPaying ? 'در حال اتصال به درگاه...' : 'پرداخت و ثبت سفارش';
  document.getElementById('checkoutBtn').disabled = isPaying;
}

async function doCheckout(){
  const { count, total } = cartSummary();
  if (count === 0) return;

  const phone = document.getElementById('phoneInput').value.trim();
  if (!/^0?9\d{9}$/.test(phone)) {
    showToast('شماره موبایل را درست وارد کنید');
    return;
  }

  const order = Object.entries(cart).map(([id, qty]) => {
    const p = PRODUCTS.find(p => p.id == id);
    return { id: p.id, name: p.name, qty, price: p.price };
  });

  const telegramUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user
    ? tg.initDataUnsafe.user
    : null;

  const payload = { order, total, phone, telegramUser };

  setPaying(true);
  try {
    if (DEMO_MODE) {
      await new Promise(res => setTimeout(res, 900));
      if (tg) {
        tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        showToast('سفارش ثبت شد · در حالت آزمایشی بدون اتصال به زرینپال');
        cart = {};
        closeDrawer();
        renderProducts();
        renderCartBar();
      }
    } else {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.paymentUrl) {
        if (tg && tg.openLink) tg.openLink(data.paymentUrl);
        else window.location.href = data.paymentUrl;
      } else {
        showToast('خطا در اتصال به درگاه پرداخت');
      }
    }
  } catch (err) {
    showToast('خطا در برقراری ارتباط با سرور');
  } finally {
    setPaying(false);
  }
}
document.getElementById('checkoutBtn').onclick = doCheckout;

function updateMainButton(count, total){
  if (!tg || !tg.MainButton) return;
  if (count > 0) {
    tg.MainButton.setText('پرداخت · ' + formatPrice(total) + ' تومان');
    tg.MainButton.color = '#d7dbe0';
    tg.MainButton.textColor = '#1b1b1d';
    tg.MainButton.show();
  } else {
    tg.MainButton.hide();
  }
}
if (tg && tg.MainButton) {
  tg.MainButton.onClick(() => { openDrawer(); });
}

renderChips();
renderProducts();
renderCartBar();
</script>
</body>
</html>
