<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>گالری نقره محمودی</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#1b1b1d;
    --velvet:#3a1620;
    --velvet-2:#4a1c28;
    --silver:#d7dbe0;
    --silver-dim:#9a9fa6;
    --chrome:#eef1f4;
    --ember:#8a4b3a;
    --ivory:#f2efe9;
    --gold:#c9a961;
    --good:#5a8f6b;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: radial-gradient(120% 55% at 50% -10%, #ffffff0d 0%, transparent 60%), var(--graphite);
    color:var(--ivory);
    font-family:'Vazirmatn', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    padding-bottom:calc(96px + var(--safe-bottom));
  }
  ::selection{background:var(--silver); color:var(--graphite);}
  img{-webkit-user-drag:none;}

  header{
    position:sticky; top:0; z-index:30;
    padding:16px 16px 12px;
    background:linear-gradient(180deg, var(--graphite) 65%, transparent);
    backdrop-filter: blur(6px);
    border-bottom:1px solid #d7dbe022;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid #d7dbe030;
    background:#ffffff08; color:var(--silver); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:0 0 auto;
  }
  .icon-btn svg{width:18px; height:18px;}
  .brand-center{display:flex; flex-direction:column; align-items:center; flex:1; min-width:0;}
  .logo-img{width:40px; height:40px; border-radius:50%; object-fit:cover; margin-bottom:4px; box-shadow:0 2px 8px #00000060;}
  .brand{font-size:17px; font-weight:800; color:var(--chrome); white-space:nowrap;}
  .tagline{font-size:11px; color:var(--silver-dim); margin-top:2px;}

  .loyalty-strip{
    margin-top:12px; display:flex; align-items:center; justify-content:space-between;
    background:#ffffff08; border:1px solid #c9a96130; border-radius:12px; padding:8px 12px;
    font-size:11.5px; color:var(--silver-dim);
  }
  .loyalty-strip b{color:var(--gold);}

  .search-wrap{overflow:hidden; max-height:0; transition:max-height .25s;}
  .search-wrap.open{max-height:60px; margin-top:10px;}
  .search-wrap input{
    width:100%; padding:11px 14px; border-radius:12px; border:1px solid #d7dbe030;
    background:#ffffff0a; color:var(--ivory); font-family:inherit; font-size:13.5px;
  }
  .search-wrap input::placeholder{color:#ffffff55;}

  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:14px 16px 4px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 18px; border-radius:999px;
    border:1px solid #d7dbe030; color:var(--silver-dim);
    font-size:13px; font-weight:500; white-space:nowrap;
    background:#ffffff08; cursor:pointer; transition:.2s;
  }
  .chip.active{ background:var(--silver); color:var(--graphite); border-color:var(--silver); font-weight:700; }

  main{padding:10px 16px 20px;}
  .card{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg, var(--velvet), var(--velvet-2));
    border:1px solid #d7dbe022;
    border-radius:18px;
    padding:12px; margin-bottom:12px;
    position:relative; overflow:hidden; cursor:pointer;
  }
  .card::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(60% 100% at 100% 0%, #ffffff10, transparent);
    pointer-events:none;
  }
  .photo{
    flex:0 0 auto; width:72px; height:72px; border-radius:14px; position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .photo .ring{ width:34px; height:34px; border-radius:50%; border:5px solid var(--silver); box-shadow: inset 0 0 0 1px #00000030, 0 3px 8px #00000050; }
  .photo .gem{ position:absolute; top:12px; left:50%; transform:translateX(-50%) rotate(45deg); width:11px; height:11px; border-radius:2px; }
  .info{flex:1; min-width:0;}
  .name{font-size:14.5px; font-weight:700; color:var(--chrome);}
  .rating-row{display:flex; align-items:center; gap:5px; margin-top:3px;}
  .stars{color:var(--gold); font-size:11px; letter-spacing:1px;}
  .rating-count{font-size:10.5px; color:var(--silver-dim);}
  .notes{font-size:11.5px; color:var(--silver-dim); margin-top:3px; line-height:1.6;}
  .row-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
  .price{font-size:13px; font-weight:700; color:var(--chrome);}
  .price::after{content:' تومان';font-weight:500; font-size:10.5px; color:var(--silver-dim);}
  .add-btn{
    width:32px; height:32px; border-radius:50%; border:none;
    background:var(--silver); color:var(--graphite); font-size:18px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .15s;
  }
  .add-btn:active{transform:scale(.88);}
  .stepper{ display:flex; align-items:center; gap:10px; background:#00000030; border-radius:999px; padding:4px 10px; }
  .stepper button{ width:22px;height:22px;border:none;border-radius:50%; background:var(--silver); color:var(--graphite); font-weight:800; font-size:14px; cursor:pointer; }
  .stepper span{font-size:13px; font-weight:700; min-width:14px; text-align:center;}

  /* ---------- Cart bar ---------- */
  .cart-bar{
    position:fixed; left:16px; right:16px; bottom:calc(16px + var(--safe-bottom));
    background:var(--silver); color:var(--graphite);
    border-radius:16px; padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 10px 28px #00000070;
    z-index:40; cursor:pointer;
    transform:translateY(120%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .cart-bar.show{transform:translateY(0);}
  .cart-bar .left{font-weight:800; font-size:14px; display:flex; gap:8px; align-items:center;}
  .cart-bar .count{
    background:var(--graphite); color:var(--silver);
    width:22px;height:22px;border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
  }
  .cart-bar .total{font-weight:800; font-size:14px;}

  /* ---------- AI chat floating button ---------- */
  .ai-fab{
    position:fixed; left:16px; bottom:calc(96px + var(--safe-bottom));
    width:50px; height:50px; border-radius:50%; z-index:45;
    background:linear-gradient(135deg, var(--gold), #a9895a); color:var(--graphite);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px #00000060; cursor:pointer; border:none;
  }
  .ai-fab svg{width:22px; height:22px;}

  /* ---------- Overlays / drawers ---------- */
  .overlay{
    position:fixed; inset:0; background:#000000a8; opacity:0; pointer-events:none;
    transition:opacity .3s; z-index:50;
  }
  .overlay.show{opacity:1; pointer-events:auto;}

  .drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--graphite); border-radius:22px 22px 0 0;
    border-top:1px solid #d7dbe030;
    padding:16px 18px calc(16px + var(--safe-bottom));
    transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
    max-height:85vh; display:flex; flex-direction:column;
  }
  .drawer.show{transform:translateY(0);}
  .drawer-handle{ width:38px; height:4px; background:#d7dbe055; border-radius:99px; margin:0 auto 12px; }
  .drawer h3{margin:0 0 10px; font-size:15.5px; color:var(--chrome);}

  .step-dots{display:flex; justify-content:center; gap:6px; margin-bottom:14px;}
  .step-dots span{width:7px; height:7px; border-radius:50%; background:#d7dbe030;}
  .step-dots span.active{background:var(--silver); width:18px; border-radius:4px;}

  .drawer-body{overflow-y:auto; flex:1; padding-bottom:4px;}

  .drawer-item{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #ffffff10; }
  .drawer-item .di-name{font-size:13px; font-weight:600;}
  .drawer-item .di-price{font-size:11px; color:var(--silver-dim); margin-top:2px;}
  .drawer-total{ display:flex; justify-content:space-between; align-items:center; padding:12px 0 4px; font-size:14.5px; font-weight:800; color:var(--chrome); }
  .empty-cart{text-align:center; color:var(--silver-dim); padding:26px 0; font-size:13px;}

  .form-block{margin-top:8px;}
  .form-block label{font-size:11.5px; color:var(--silver-dim); display:block; margin-bottom:6px;}
  .form-block input, .form-block textarea{
    width:100%; padding:11px 13px; border-radius:12px; border:1px solid #d7dbe030;
    background:#ffffff0a; color:var(--ivory); font-family:inherit; font-size:13px;
    margin-bottom:10px; resize:none;
  }
  .form-block input::placeholder, .form-block textarea::placeholder{color:#ffffff55;}

  .ship-option{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border-radius:14px; border:1.5px solid #d7dbe030; margin-bottom:9px; cursor:pointer;
  }
  .ship-option.active{border-color:var(--silver); background:#ffffff0a;}
  .ship-option .so-name{font-size:13px; font-weight:700;}
  .ship-option .so-eta{font-size:11px; color:var(--silver-dim); margin-top:2px;}
  .ship-option .so-price{font-size:12.5px; font-weight:700; color:var(--gold);}

  .card-info-box{
    background:#ffffff0a; border:1px solid #c9a96140; border-radius:14px; padding:14px; margin-bottom:12px;
  }
  .card-info-box .ci-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .card-info-box .ci-label{font-size:11px; color:var(--silver-dim);}
  .card-info-box .ci-value{font-size:13.5px; font-weight:700; color:var(--chrome); direction:ltr; letter-spacing:.5px;}
  .copy-btn{
    border:1px solid var(--gold); color:var(--gold); background:transparent; border-radius:8px;
    padding:4px 10px; font-size:11px; font-family:inherit; cursor:pointer;
  }
  .amount-highlight{
    text-align:center; padding:14px; border-radius:14px; background:linear-gradient(135deg,var(--gold),#a9895a);
    color:var(--graphite); font-weight:800; font-size:17px; margin-bottom:12px;
  }
  .amount-highlight span{display:block; font-size:11px; font-weight:600; margin-top:2px;}

  .receipt-upload{
    border:1.5px dashed #d7dbe040; border-radius:14px; padding:18px; text-align:center;
    font-size:12px; color:var(--silver-dim); margin-bottom:12px; position:relative;
  }
  .receipt-upload input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .receipt-preview{width:100%; max-height:160px; object-fit:contain; border-radius:10px; margin-top:8px;}

  .order-id-box{
    text-align:center; background:#ffffff0a; border-radius:14px; padding:16px; margin-bottom:10px;
  }
  .order-id-box .oid{font-size:20px; font-weight:800; color:var(--gold); direction:ltr; letter-spacing:1px; margin:6px 0;}
  .success-icon{width:46px;height:46px;border-radius:50%;background:var(--good);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:22px;}

  .nav-row{display:flex; gap:10px; margin-top:10px;}
  .btn{
    flex:1; padding:14px; border:none; border-radius:14px; font-size:14px; font-weight:800;
    font-family:inherit; cursor:pointer;
  }
  .btn-primary{background:var(--silver); color:var(--graphite);}
  .btn-secondary{background:#ffffff10; color:var(--silver);}
  .btn:disabled{opacity:.5;}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:var(--silver); color:var(--graphite); padding:10px 20px; border-radius:999px;
    font-size:12.5px; font-weight:700; z-index:90; transition:transform .3s;
    white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  /* ---------- Product detail overlay ---------- */
  .detail-sheet{
    position:fixed; inset:0; z-index:70; background:var(--graphite);
    transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;
  }
  .detail-sheet.show{transform:translateX(0);}
  .detail-top{position:sticky; top:0; z-index:2; padding:14px; display:flex; justify-content:space-between; background:linear-gradient(180deg, var(--graphite) 70%, transparent);}
  .detail-photo{
    width:100%; height:220px; display:flex; align-items:center; justify-content:center; position:relative;
  }
  .detail-photo .ring{width:90px; height:90px; border-radius:50%; border:9px solid var(--silver); box-shadow: inset 0 0 0 2px #00000030, 0 6px 16px #00000060;}
  .detail-photo .gem{position:absolute; top:38px; left:50%; transform:translateX(-50%) rotate(45deg); width:26px; height:26px; border-radius:4px;}
  .detail-body{padding:6px 20px 30px;}
  .detail-name{font-size:19px; font-weight:800; color:var(--chrome);}
  .detail-price{font-size:17px; font-weight:800; color:var(--gold); margin-top:6px;}
  .detail-price::after{content:' تومان'; font-size:12px; color:var(--silver-dim); font-weight:500;}
  .feature-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:16px 0; }
  .feature-item{ background:#ffffff08; border-radius:10px; padding:9px 11px; }
  .feature-item .fk{font-size:10.5px; color:var(--silver-dim);}
  .feature-item .fv{font-size:12.5px; font-weight:700; margin-top:2px;}
  .size-label{font-size:12px; color:var(--silver-dim); margin:14px 0 8px;}
  .size-chips{display:flex; gap:8px; flex-wrap:wrap;}
  .size-chip{
    padding:7px 14px; border-radius:10px; border:1.5px solid #d7dbe030; font-size:12.5px; cursor:pointer; color:var(--silver-dim);
  }
  .size-chip.active{border-color:var(--silver); color:var(--chrome); background:#ffffff0a; font-weight:700;}
  .detail-qty-row{display:flex; align-items:center; justify-content:space-between; margin:18px 0;}
  .detail-add-btn{
    width:100%; padding:15px; border:none; border-radius:14px; background:var(--silver); color:var(--graphite);
    font-size:14.5px; font-weight:800; font-family:inherit; cursor:pointer; margin-top:6px;
  }
  .share-btn-inline{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:11px; margin-top:8px;
    border:1px solid #d7dbe030; border-radius:12px; background:transparent; color:var(--silver-dim); font-size:12px; font-family:inherit; cursor:pointer;
  }
  .review-summary{display:flex; align-items:center; gap:10px; margin:14px 0;}
  .review-summary .avg{font-size:26px; font-weight:800; color:var(--gold);}
  .review-item{ padding:12px 0; border-bottom:1px solid #ffffff10; }
  .review-item .ru{font-size:12.5px; font-weight:700;}
  .review-item .rs{color:var(--gold); font-size:11px; margin-top:2px;}
  .review-item .rc{font-size:12px; color:var(--silver-dim); margin-top:4px; line-height:1.7;}

  /* ---------- AI chat panel ---------- */
  .chat-panel{
    position:fixed; left:12px; right:12px; bottom:calc(16px + var(--safe-bottom)); top:60px; z-index:80;
    background:var(--graphite); border:1px solid #d7dbe030; border-radius:20px;
    display:flex; flex-direction:column; overflow:hidden;
    transform:scale(.9); opacity:0; pointer-events:none; transition:.25s;
    transform-origin:bottom left;
  }
  .chat-panel.show{transform:scale(1); opacity:1; pointer-events:auto;}
  .chat-head{padding:14px; border-bottom:1px solid #ffffff10; display:flex; justify-content:space-between; align-items:center;}
  .chat-head b{font-size:13.5px;}
  .chat-head span{font-size:10.5px; color:var(--silver-dim);}
  .chat-msgs{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;}
  .msg{max-width:80%; padding:9px 13px; border-radius:14px; font-size:12.5px; line-height:1.7;}
  .msg.bot{background:#ffffff0e; align-self:flex-start; border-bottom-left-radius:4px;}
  .msg.user{background:var(--silver); color:var(--graphite); align-self:flex-end; border-bottom-right-radius:4px; font-weight:600;}
  .chat-input-row{display:flex; gap:8px; padding:12px; border-top:1px solid #ffffff10;}
  .chat-input-row input{
    flex:1; padding:11px 14px; border-radius:999px; border:1px solid #d7dbe030;
    background:#ffffff0a; color:var(--ivory); font-family:inherit; font-size:13px;
  }
  .chat-send{width:40px; height:40px; border-radius:50%; border:none; background:var(--silver); color:var(--graphite); font-size:16px; cursor:pointer;}
  .quick-q{display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 10px;}
  .quick-q span{
    font-size:11px; padding:6px 11px; border-radius:999px; border:1px solid #d7dbe030; color:var(--silver-dim); cursor:pointer;
  }

  /* ---------- Admin panel ---------- */
  .admin-fab{
    position:fixed; right:16px; bottom:calc(96px + var(--safe-bottom));
    width:50px; height:50px; border-radius:50%; z-index:45;
    background:linear-gradient(135deg, #5a8f6b, #3d6b4a); color:#fff;
    display:none; align-items:center; justify-content:center;
    box-shadow:0 8px 20px #00000060; cursor:pointer; border:none; font-size:20px;
  }
  .admin-fab.show{display:flex;}
  .admin-sheet{
    position:fixed; inset:0; z-index:100; background:var(--graphite);
    transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .admin-sheet.show{transform:translateY(0);}
  .admin-head{
    padding:14px 16px; border-bottom:1px solid #ffffff15;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg, #1b1b1d 80%, transparent);
  }
  .admin-head h2{margin:0; font-size:16px; color:var(--chrome);}
  .admin-tabs{display:flex; gap:5px; padding:10px 12px; overflow-x:auto; border-bottom:1px solid #ffffff10; scrollbar-width:none;}
  .admin-tabs::-webkit-scrollbar{display:none;}
  .admin-tab{ font-size:12px; white-space:nowrap;
    flex:0 0 auto; padding:8px 16px; border-radius:999px; border:1px solid #d7dbe030;
    background:#ffffff08; color:var(--silver-dim); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .admin-tab.active{background:var(--silver); color:var(--graphite); border-color:var(--silver);}
  .admin-body{flex:1; overflow-y:auto; padding:14px 16px 30px;}
  .admin-card{
    background:#ffffff08; border:1px solid #d7dbe022; border-radius:14px;
    padding:12px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start;
  }
  .admin-card img, .admin-card .ph{
    width:56px; height:56px; border-radius:10px; object-fit:cover; flex:0 0 auto;
    background:#00000040; display:flex; align-items:center; justify-content:center;
  }
  .admin-card .info{flex:1; min-width:0;}
  .admin-card .aname{font-size:13.5px; font-weight:700; color:var(--chrome);}
  .admin-card .ameta{font-size:11px; color:var(--silver-dim); margin-top:3px;}
  .admin-card .actions{display:flex; gap:6px; margin-top:8px;}
  .admin-card .actions button{
    padding:5px 10px; border-radius:8px; border:1px solid #d7dbe030;
    background:#ffffff0a; color:var(--silver); font-size:11px; font-family:inherit; cursor:pointer;
  }
  .admin-card .actions button.del{border-color:#8a4b3a; color:#c97a6a;}
  .admin-form label{font-size:11.5px; color:var(--silver-dim); display:block; margin:10px 0 5px;}
  .admin-form input, .admin-form textarea, .admin-form select{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid #d7dbe030;
    background:#ffffff0a; color:var(--ivory); font-family:inherit; font-size:13px;
  }
  .admin-form textarea{resize:vertical; min-height:60px;}
  .admin-form .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .img-preview-box{
    width:100%; height:120px; border-radius:12px; border:1.5px dashed #d7dbe040;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    position:relative; margin-top:8px; background:#00000030;
  }
  .img-preview-box img{max-width:100%; max-height:100%; object-fit:contain;}
  .img-preview-box input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .stock-badge{
    display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:700;
  }
  .stock-ok{background:#5a8f6b33; color:#7dba8f;}
  .stock-low{background:#8a4b3a44; color:#d48a7a;}
  .stock-out{background:#ffffff15; color:var(--silver-dim);}
  .loyalty-admin-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid #ffffff10;
  }
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .stat-box{
    background:#ffffff08; border-radius:12px; padding:14px; text-align:center;
  }
  .stat-box .sv{font-size:20px; font-weight:800; color:var(--gold);}

const faDigits = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const formatPrice = n => faDigits(Math.round(n).toLocaleString('en-US'));
function starString(avg){
  const full = Math.round(avg);
  return '★★★★★☆☆☆☆☆'.slice(5-full, 10-full);
}
function avgRating(p){
  if (!p.reviews || !p.reviews.length) return 0;
  return p.reviews.reduce((s,r)=>s+r.stars,0) / p.reviews.length;
}
function genOrderId(){

/* ---------------- Render: chips ---------------- */
function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = '';
  CATS.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (cat === activeCat ? ' active' : '');
    chip.textContent = cat;
    chip.onclick = () => { activeCat = cat; renderChips(); renderProducts(); };
    el.appendChild(chip);
  });
}

/* ---------------- Render: products ---------------- */
function renderProducts(){
  const el = document.getElementById('product-list');
  el.innerHTML = '';
  let list = PRODUCTS.filter(p => activeCat === 'همه' || p.cat === activeCat);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q) || p.notes.toLowerCase().includes(q) || p.cat.includes(q));
  }
  if (!list.length) {
    el.innerHTML = '<div class="empty-cart">محصولی با این مشخصات پیدا نشد</div>';
    return;
  }
  list.forEach(p => {
    const avg = avgRating(p);
    const stock = p.stock != null ? p.stock : 0;
    const stockClass = stock <= 0 ? 'stock-out' : stock <= 3 ? 'stock-low' : 'stock-ok';
    const stockText = stock <= 0 ? 'ناموجود' : stock <= 3 ? 'موجودی کم' : '';
    const photoHtml = p.image
      ? `<img class="real-img" src="${p.image}" alt="">`
      : `<div class="ring"></div><div class="gem" style="background:${p.gem||'#c9ced4'}"></div>`;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="photo" style="background:linear-gradient(135deg, ${(p.gem||'#c9ced4')}55, #00000040)">
        ${photoHtml}
      </div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="rating-row"><span class="stars">${starString(avg)}</span><span class="rating-count">(${faDigits((p.reviews||[]).length)} نظر)</span>
          ${stockText ? `<span class="stock-badge ${stockClass}" style="margin-right:6px">${stockText}</span>` : ''}
        </div>
        <div class="notes">${p.notes||''}</div>
        <div class="row-bottom">
          <div class="price">${formatPrice(p.price)}</div>
          <div class="qty-holder" id="qty-${p.id}"></div>
        </div>
      </div>
    `;
    card.addEventListener('click', (e) => { openDetail(p.id); });
    el.appendChild(card);
    renderQtyControl(p.id, cartQtyForProduct(p.id));
  });
}

function cartQtyForProduct(id){
  let total = 0;
  Object.keys(cart).forEach(key => { if (cart[key].id === id) total += cart[key].qty; });
  return total;
}

function renderQtyControl(id, qty){
  const holder = document.getElementById('qty-' + id);
  if (!holder) return;
  holder.innerHTML = `<button class="add-btn" data-id="${id}">+</button>`;
  holder.querySelector('.add-btn').onclick = (e) => { e.stopPropagation(); openDetail(id); };
}

  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    else { navigator.clipboard && navigator.clipboard.writeText(text + ' ' + BOT_LINK); showToast('لینک محصول کپی شد'); }
  };
}

/* ---------------- Cart summary ---------------- */
function cartLines(){
  return Object.entries(cart).map(([key, item]) => {
    const p = PRODUCTS.find(p => p.id === item.id);
    return { key, p, qty:item.qty, size:item.size };
  }).filter(l => l.p && l.qty > 0);
}
function cartSummary(){
  let count = 0, total = 0;
  cartLines().forEach(l => { count += l.qty; total += l.qty * l.p.price; });
  return { count, total };
}
function shippingCost(){ return selectedShipping ? selectedShipping.cost : 0; }
function discountAmount(){
  if (!appliedDiscount) return 0;
  const sub = cartSummary().total;
  if (appliedDiscount.percent) return Math.round(sub * (appliedDiscount.percent / 100));
  if (appliedDiscount.amount) return Math.min(appliedDiscount.amount, sub);
  return 0;
}
function grandTotal(){ return Math.max(0, cartSummary().total + shippingCost() - discountAmount()); }
function rewardForOrder(){ return Math.round(cartSummary().total * 0.02 / 1000) * 1000; }

function compressImage(dataUrl, quality, maxW){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function renderCartBar(){
  const { count, total } = cartSummary();
  const bar = document.getElementById('cartBar');
  document.getElementById('cartCount').textContent = faDigits(count);
  document.getElementById('cartTotal').textContent = formatPrice(total) + ' تومان';
  bar.classList.toggle('show', count > 0);
  updateMainButton(count, total);
}

function bindStepEvents(){
  if (checkoutStep === 0) {
    document.querySelectorAll('#drawerBody [data-act]').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.key;
        const delta = btn.dataset.act === 'inc' ? 1 : -1;
        cart[key].qty += delta;
        if (cart[key].qty <= 0) delete cart[key];
        renderDrawerStep(); renderProducts(); renderCartBar();
      };
    });
    const toAddr = document.getElementById('toAddressBtn');
    if (toAddr) toAddr.onclick = () => goToStep(1);
  }
  if (checkoutStep === 1) {
    document.getElementById('backToCartBtn').onclick = () => goToStep(0);
    document.getElementById('toShippingBtn').onclick = () => {
      address.name = document.getElementById('addrName').value.trim();
      address.phone = document.getElementById('addrPhone').value.trim();
      address.city = document.getElementById('addrCity').value.trim();
      address.full = document.getElementById('addrFull').value.trim();
      address.postal = document.getElementById('addrPostal').value.trim();
      if (!address.name || !/^0?9\d{9}$/.test(address.phone) || !address.city || !address.full) {
        showToast('لطفاً همه فیلدهای ضروری را کامل کنید'); return;
      }
      goToStep(2);
    };
  }
  if (checkoutStep === 2) {
    document.querySelectorAll('.ship-option').forEach(opt => {
      opt.onclick = () => {
        selectedShipping = SHIPPING_METHODS.find(m => m.id === opt.dataset.id);
        renderDrawerStep();
      };
    });
    document.getElementById('backToAddrBtn').onclick = () => goToStep(1);
    const toPay = document.getElementById('toPaymentBtn');
    if (toPay) toPay.onclick = () => { if (selectedShipping) goToStep(3); };
  }
  if (checkoutStep === 3) {
    document.getElementById('copyCardBtn').onclick = () => {
      const raw = (CARD_INFO.number || '').replace(/[^\d۰-۹0-9]/g,'');
      navigator.clipboard && navigator.clipboard.writeText(raw || CARD_INFO.number);
      showToast('شماره کارت کپی شد');
    };
    const shebaBtn = document.getElementById('copyShebaBtn');
    if (shebaBtn) shebaBtn.onclick = () => {
      navigator.clipboard && navigator.clipboard.writeText(CARD_INFO.sheba || '');
      showToast('شماره شبا کپی شد');
    };
    const applyBtn = document.getElementById('applyDiscountBtn');
    if (applyBtn) applyBtn.onclick = () => {
      const code = (document.getElementById('discountCodeInput').value || '').trim().toUpperCase();
      if (!code) { appliedDiscount = null; renderDrawerStep(); return; }
      const found = discounts.find(d => d.code.toUpperCase() === code && d.active !== false);
      if (!found) { showToast('کد تخفیف نامعتبر است'); return; }
      appliedDiscount = found;
      showToast('تخفیف اعمال شد');
      renderDrawerStep();
    };
    document.getElementById('backToShipBtn').onclick = () => goToStep(2);
    document.getElementById('toConfirmBtn').onclick = () => {
      last4 = document.getElementById('last4Input').value.trim();
      if (!/^\d{4}$/.test(last4)) { showToast('۴ رقم آخر کارت را درست وارد کنید'); return; }
      goToStep(4);
    };
  }
  if (checkoutStep === 4) {
    if (lastOrderId) {
      const closeBtn = document.getElementById('closeAfterOrderBtn');
      if (closeBtn) closeBtn.onclick = () => {
        cart = {}; selectedShipping = null; last4 = ''; lastOrderId = null; receiptDataUrl = null; appliedDiscount = null;
        closeDrawer(); renderProducts(); renderCartBar();
      };
      return;
    }
    document.getElementById('backToPayBtn').onclick = () => goToStep(3);
    const fileInput = document.getElementById('receiptInput');
    fileInput.onchange = () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { showToast('حجم عکس نباید بیشتر از ۸ مگابایت باشد'); return; }
      const reader = new FileReader();
      reader.onload = e => {
        // فشرده‌سازی سبک برای کاهش حجم
        compressImage(e.target.result, 0.7, 1200).then(compressed => {
          receiptDataUrl = compressed;
          renderDrawerStep();
        }).catch(() => {
          receiptDataUrl = e.target.result;
          renderDrawerStep();
        });
      };
      reader.readAsDataURL(file);
    };
    document.getElementById('finalSubmitBtn').onclick = submitOrder;
  }
}

function submitOrder(){
  if (!receiptDataUrl) {
    showToast('بارگذاری تصویر رسید الزامی است');
    return;
  }
  const orderId = genOrderId();
  lastOrderId = orderId;
  const lines = cartLines().map(l => ({ id:l.p.id, name:l.p.name, size:l.size, qty:l.qty, price:l.p.price }));
  // کاهش موجودی
  lines.forEach(line => {
    const p = PRODUCTS.find(x => x.id === line.id);
    if (p && p.stock != null) {
      p.stock = Math.max(0, p.stock - line.qty);
    }
  });
  saveProducts();
  renderProducts();

  const payload = {
    type: 'new_order',
    orderId,
    address,
    shipping: selectedShipping,
    last4,
    discount: appliedDiscount ? { code: appliedDiscount.code, amount: discountAmount() } : null,
    items: lines,
    subtotal: cartSummary().total,
    shippingCost: shippingCost(),
    discountAmount: discountAmount(),
    total: grandTotal(),
    hasReceipt: true,
    telegramUser: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null,
    createdAt: new Date().toISOString()
  };

  // ذخیره سفارش برای مشاهده در پنل ادمین (بدون عکس کامل برای جلوگیری از پر شدن storage)
  recentOrders.unshift({
    ...payload,
    receiptThumb: receiptDataUrl ? receiptDataUrl.substring(0, 80) + '…' : null
  });
  if (recentOrders.length > 50) recentOrders = recentOrders.slice(0, 50);
  try { localStorage.setItem(ORDERS_KEY, JSON.stringify(recentOrders)); } catch(e){}

  // امتیاز وفاداری
  const pts = Math.round(rewardForOrder() / 1000);
  loyaltyPoints += pts;
  document.getElementById('loyaltyPoints').textContent = faDigits(loyaltyPoints);
  saveLoyalty();

  // ارسال به ربات — عکس رسید به‌خاطر محدودیت حجم sendData ارسال نمی‌شود
  // کاربر باید عکس را جداگانه با شماره پیگیری به ربات بفرستد (ربات آن را به ادمین فوروارد می‌کند)
  if (tg) {
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
    try {
      // فقط متادیتای سفارش (بدون base64 عکس) ارسال می‌شود
      tg.sendData(JSON.stringify(payload));
    } catch(e) {
      console.warn('sendData failed', e);
    }
  }
  renderDrawerStep();
}

function renderQuickQuestions(){
  const qs = ['زمان ارسال چقدره؟','عیار نقره چنده؟','شرایط مرجوعی؟','چطور پرداخت کنم؟'];
  document.getElementById('quickQ').innerHTML = qs.map(q => `<span data-q="${q}">${q}</span>`).join('');
  document.querySelectorAll('#quickQ span').forEach(s => { s.onclick = () => sendChat(s.dataset.q); });
}

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatMsgs.appendChild(div);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function aiFallbackAnswer(q){
  const lower = q.toLowerCase();
  for (const item of AI_FAQ) {
    if (item.keys.some(k => q.includes(k))) return item.answer;
  }
  return 'ممنون از سوالتون 🌸 همکاران ما به‌زودی پاسخ دقیق‌تری می‌دهند؛ در همین حین می‌توانید محصولات را در فروشگاه مرور کنید.';
}

async function sendChat(text){
  if (!text) return;
  addMsg('user', text);
  document.getElementById('chatInput').value = '';
  if (AI_DEMO_MODE) {
    setTimeout(() => addMsg('bot', aiFallbackAnswer(text)), 500);
  } else {
    try {
      const res = await fetch(AI_BACKEND_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message:text })
      });
      const data = await res.json();
      addMsg('bot', data.reply || aiFallbackAnswer(text));
    } catch(e) { addMsg('bot', aiFallbackAnswer(text)); }
  }
}

function renderAdminBody(){

  if (adminTab === 'products') {

function bindAdminEvents(){
  // Products list
  const addBtn = document.getElementById('addProductBtn');
  if (addBtn) addBtn.onclick = () => { editingProductId = 'new'; renderAdminBody(); };

  document.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = () => { editingProductId = parseInt(btn.dataset.edit); renderAdminBody(); };
  });
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      const id = parseInt(btn.dataset.del);
      if (!confirm('آیا از حذف این محصول مطمئن هستید؟')) return;
      PRODUCTS = PRODUCTS.filter(p => p.id !== id);
      saveProducts();
      renderProducts();
      renderAdminBody();
      showToast('محصول حذف شد');
    };
  });

  // Form
  const backBtn = document.getElementById('backToListBtn');
  if (backBtn) backBtn.onclick = () => { editingProductId = null; renderAdminBody(); };

  const imgInput = document.getElementById('imgInput');
  if (imgInput) {
    imgInput.onchange = () => {
      const file = imgInput.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        showToast('حجم عکس باید کمتر از ۵ مگابایت باشد');
        return;
      }
      const reader = new FileReader();
      reader.onload = e => {
        compressImage(e.target.result, 0.72, 900).then(compressed => {
          const box = document.getElementById('imgBox');
          box.innerHTML = `<img src="${compressed}" id="imgPrev"><input type="file" accept="image/*" id="imgInput">`;
          document.getElementById('imgInput').onchange = imgInput.onchange;
          box.dataset.tempImage = compressed;
        }).catch(() => {
          const box = document.getElementById('imgBox');
          box.innerHTML = `<img src="${e.target.result}" id="imgPrev"><input type="file" accept="image/*" id="imgInput">`;
          document.getElementById('imgInput').onchange = imgInput.onchange;
          box.dataset.tempImage = e.target.result;
        });
      };
      reader.readAsDataURL(file);
    };
  }
  const removeImg = document.getElementById('removeImgBtn');
  if (removeImg) removeImg.onclick = () => {
    const box = document.getElementById('imgBox');
    box.innerHTML = '<span style="color:var(--silver-dim);font-size:12px">برای آپلود کلیک کنید</span><input type="file" accept="image/*" id="imgInput">';
    box.dataset.tempImage = '';
    document.getElementById('imgInput').onchange = imgInput ? imgInput.onchange : null;
  };

  const addFeat = document.getElementById('addFeatBtn');
  if (addFeat) addFeat.onclick = () => {
    const list = document.getElementById('featList');
    const i = list.children.length;
    const div = document.createElement('div');
    div.className = 'row2';
    div.style.marginBottom = '6px';
    div.innerHTML = `<input data-fk="${i}" placeholder="عنوان مشخصه"><input data-fv="${i}" placeholder="مقدار">`;
    list.appendChild(div);
  };

  const saveBtn = document.getElementById('saveProductBtn');
  if (saveBtn) saveBtn.onclick = () => {
    const isNew = editingProductId === 'new';
    let p = isNew ? { id: nextProductId(), reviews: [] } : PRODUCTS.find(x => x.id === editingProductId);
    if (!p) return;

    p.name = document.getElementById('fName').value.trim();
    p.cat = document.getElementById('fCat').value;
    p.price = parseInt(document.getElementById('fPrice').value) || 0;
    p.stock = parseInt(document.getElementById('fStock').value) || 0;
    p.gem = document.getElementById('fGem').value.trim() || '#c9ced4';
    p.notes = document.getElementById('fNotes').value.trim();

    const sizesRaw = document.getElementById('fSizes').value.trim();
    p.sizes = sizesRaw ? sizesRaw.split(/[,،]/).map(s => s.trim()).filter(Boolean) : null;

    const features = {};
    document.querySelectorAll('#featList [data-fk]').forEach(inp => {
      const i = inp.dataset.fk;
      const k = inp.value.trim();
      const vEl = document.querySelector(`#featList [data-fv="${i}"]`);
      const v = vEl ? vEl.value.trim() : '';
      if (k) features[k] = v;
    });
    p.features = features;

    const box = document.getElementById('imgBox');
    if (box && box.dataset.tempImage !== undefined) {
      p.image = box.dataset.tempImage || null;
    } else if (document.getElementById('imgPrev')) {
      // keep existing
    } else {
      p.image = null;
    }

    if (!p.name) { showToast('نام محصول الزامی است'); return; }

    if (isNew) PRODUCTS.push(p);
    saveProducts();
    renderProducts();
    editingProductId = null;
    renderAdminBody();
    showToast(isNew ? 'محصول اضافه شد' : 'تغییرات ذخیره شد');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  };

  // Inventory stock +/-
  document.querySelectorAll('[data-stock-inc]').forEach(btn => {
    btn.onclick = () => {
      const p = PRODUCTS.find(x => x.id === parseInt(btn.dataset.stockInc));
      if (p) { p.stock = (p.stock||0) + 1; saveProducts(); renderProducts(); renderAdminBody(); }
    };
  });
  document.querySelectorAll('[data-stock-dec]').forEach(btn => {
    btn.onclick = () => {
      const p = PRODUCTS.find(x => x.id === parseInt(btn.dataset.stockDec));
      if (p) { p.stock = Math.max(0, (p.stock||0) - 1); saveProducts(); renderProducts(); renderAdminBody(); }
    };
  });

  // Loyalty
  const saveCur = document.getElementById('saveCurPointsBtn');
  if (saveCur) saveCur.onclick = () => {
    loyaltyPoints = parseInt(document.getElementById('curPointsInput').value) || 0;
    document.getElementById('loyaltyPoints').textContent = faDigits(loyaltyPoints);
    saveLoyalty();
    showToast('امتیاز ذخیره شد');
  };
  const saveAllL = document.getElementById('saveAllLoyaltyBtn');
  if (saveAllL) saveAllL.onclick = () => {
    document.querySelectorAll('[data-lp]').forEach(inp => {
      const id = parseInt(inp.dataset.lp);
      const c = loyaltyCustomers.find(x => x.id === id);
      if (c) c.points = parseInt(inp.value) || 0;
    });
    saveLoyalty();
    showToast('امتیاز مشتریان ذخیره شد');
  };

  // Discounts
  const addDisc = document.getElementById('addDiscountBtn');
  if (addDisc) addDisc.onclick = () => {
    const code = (document.getElementById('newDiscCode').value || '').trim().toUpperCase();
    const type = document.getElementById('newDiscType').value;
    const val = parseInt(document.getElementById('newDiscValue').value) || 0;
    const note = (document.getElementById('newDiscNote').value || '').trim();
    if (!code || val <= 0) { showToast('کد و مقدار تخفیف را وارد کنید'); return; }
    if (discounts.some(d => d.code.toUpperCase() === code)) { showToast('این کد قبلاً وجود دارد'); return; }
    const item = { code, active: true, note };
    if (type === 'percent') item.percent = Math.min(100, val);
    else item.amount = val;
    discounts.push(item);
    saveDiscounts();
    renderAdminBody();
    showToast('کد تخفیف اضافه شد');
  };
  document.querySelectorAll('[data-toggle-discount]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.toggleDiscount);
      if (discounts[i]) {
        discounts[i].active = discounts[i].active === false ? true : false;
        saveDiscounts();
        renderAdminBody();
      }
    };
  });
  document.querySelectorAll('[data-del-discount]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.delDiscount);
      if (!confirm('حذف این کد تخفیف؟')) return;
      discounts.splice(i, 1);
      saveDiscounts();
      renderAdminBody();
      showToast('کد حذف شد');
    };
  });

  // Settings / payment
  const savePay = document.getElementById('savePaymentBtn');
  if (savePay) savePay.onclick = () => {
    CARD_INFO.owner = document.getElementById('setOwner').value.trim();
    CARD_INFO.bank = document.getElementById('setBank').value.trim();
    CARD_INFO.number = document.getElementById('setCard').value.trim();
    CARD_INFO.sheba = document.getElementById('setSheba').value.trim();
    savePaymentInfo();
    showToast('اطلاعات پرداخت ذخیره شد');
  };
}


/* ---------------- Init ---------------- */
(async function initApp(){
  showToast('در حال بارگذاری از سرور...');
  await loadPaymentInfo();
  await loadProducts();
  await loadLoyalty();
  await loadDiscounts();
  loadOrders();
  document.getElementById('loyaltyPoints').textContent = faDigits(loyaltyPoints);
  checkAdmin();
  renderChips();
  renderProducts();
  renderCartBar();
  showToast('متصل به سرور');
})();
</script>
